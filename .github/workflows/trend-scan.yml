name: trend-scan
on:
  push:
    paths: [".github/workflows/trend-scan.yml", "tools/trend_scan.py"]
  schedule:
    - cron: "30 14 * * 1-5"   # 20:00 IST on trading days
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TELEGRAM: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          pip install -q yfinance pandas requests
          mkdir -p data/scan
          python tools/trend_scan.py > /tmp/scan_log.txt 2>&1 || true
          grep -v -i "warn\|inplace\|whatsnew\|delisted\|df.drop\|df.rename" /tmp/scan_log.txt | tail -60
      - name: Commit results to main (app reads data/scan/trend_scan.json)
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          rm -f data/scan/all_metrics.csv data/scan/log.txt
          git add data/scan; git diff --cached --quiet && exit 0
          git commit -m "Trend scan $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
