name: fetch-futures
on:
  push:
    paths: [".github/workflows/fetch-futures.yml", "tools/fetch_bnf_futures.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas requests
      - run: python tools/fetch_bnf_futures.py 2>&1 | tee data_log.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git checkout -B futures-data
          mkdir -p data && mv data_log.txt data/
          git add -f data
          git commit -m "Bank Nifty futures 2017" || exit 0
          git push -f origin futures-data
