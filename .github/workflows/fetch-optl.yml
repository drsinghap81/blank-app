name: fetch-optl
on:
  push:
    paths: [".github/workflows/fetch-optl.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        part: ["2010-07-01:2011-12-31", "2012-01-01:2013-12-31", "2014-01-01:2015-12-31",
               "2016-01-01:2017-12-31", "2018-01-01:2019-12-31", "2020-01-01:2021-12-31", "2022-01-01:2023-12-31",
               "2024-01-01:2024-06-30", "2024-07-01:2026-12-31"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pandas requests
      - run: |
          P="${{ matrix.part }}"; S=${P%%:*}; E=${P##*:}
          mkdir -p opt && python tools/fetch_opt.py $S $E opt/opt_${S}.csv long 2>&1 | tee opt/log_${S}.txt
          gzip -f opt/opt_${S}.csv
          echo "TAG=${S}" >> $GITHUB_ENV
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git checkout -B optl-$TAG; git add -f opt; git commit -m "opt $TAG" || exit 0; git push -f origin optl-$TAG
