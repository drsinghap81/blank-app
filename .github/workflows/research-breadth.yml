# One-off research (18 Nov 2026): concentrated / high-conviction 9/21 swing system
name: research-breadth
on:
  workflow_dispatch:
    inputs:
      script: { description: "script name", required: false, default: signal_breadth }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy pandas yfinance lxml requests && python tools/research/${{ inputs.script || 'signal_breadth' }}.py
      - run: |
          git config user.name "trend-desk-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/research/*.json
          git commit -m "research: signal breadth" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
