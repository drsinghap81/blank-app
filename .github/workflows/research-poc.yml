# One-off research (16 Nov 2026): volume-profile POC pullback on Nifty 500
name: research-poc
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/research/poc_pullback.py", ".github/workflows/research-poc.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy pandas yfinance && python tools/research/poc_pullback.py 2>&1 | grep -v -i "warn\|failed download\|possibly delisted"
      - run: |
          git config user.name "trend-desk-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/research/poc_pullback.json data/research/poc_pullback_trades.csv.gz
          git commit -m "research: POC pullback" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
