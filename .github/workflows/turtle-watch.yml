name: turtle-watch
# Turtle 20/10 daily long (futures watch): state, levels, Telegram on new buys / exits -> data/scan/turtle.json
on:
  schedule:
    - cron: "20 11 * * 1-5"   # after the India close (Nifty, Bank Nifty)
    - cron: "40 22 * * *"     # after the US close; daily for coins
  workflow_dispatch:
  push:
    paths: ["tools/turtle_watch.py", ".github/workflows/turtle-watch.yml"]
permissions:
  contents: write
concurrency: {group: turtle-watch, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          SEND_TELEGRAM: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: pip install -q yfinance pandas requests && python tools/turtle_watch.py 2>&1 | grep -v -i "warn" | tail -5
      - run: |
          git config user.name "turtle-watch bot"; git config user.email "actions@users.noreply.github.com"
          git add data/scan/turtle.json; git diff --cached --quiet && exit 0
          git commit -qm "Turtle watch $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep $((i*7)); done
