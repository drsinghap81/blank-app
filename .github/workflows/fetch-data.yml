name: fetch-data
on:
  push:
    paths: [".github/workflows/fetch-data.yml", "tools/fetch_data.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install yfinance pandas
      - run: python tools/fetch_data.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git checkout -B data-refresh
          git add data
          git commit -m "Refresh market data" || exit 0
          git push -f origin data-refresh
