name: fetch-industry
on:
  workflow_dispatch:
    inputs:
      limit: {description: "number of symbols (0 = all)", default: "0"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install -q requests yfinance
          python tools/fetch_industry.py ${{ github.event.inputs.limit }} | tail -40
      - run: |
          git config user.name "fetch-industry bot"; git config user.email "actions@users.noreply.github.com"
          git add data/universe/nse_industry.csv || true
          git diff --cached --quiet && exit 0
          git commit -qm "NSE industry classification $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep $((i*7)); done
