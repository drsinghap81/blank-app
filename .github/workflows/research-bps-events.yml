# One-off research (17 Nov 2026): bull put spread events (support touches in uptrends, F&O stocks)
name: research-bps-events
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/research/bps_events.py", ".github/workflows/research-bps-events.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy pandas yfinance && KEEP_WIN=1 python tools/research/bps_events.py 2>&1 | grep -v -i "warn\|failed download\|possibly delisted"
      - run: |
          git config user.name "trend-desk-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/research/bps_events.csv data/optwin_put.csv
          git commit -m "research: bull put spread events" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
