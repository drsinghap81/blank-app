name: ipo-scan
on:
  push:
    paths: [".github/workflows/ipo-scan.yml", "tools/ipo_scan.py"]
  schedule:
    - cron: "15 15 * * 1-5"   # 20:45 IST on trading days
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          SEND_TELEGRAM: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          pip install -q yfinance pandas requests
          mkdir -p data/scan
          python tools/sector_state.py > /dev/null 2>&1 || true
          python tools/ipo_scan.py > /tmp/ipo_log.txt 2>&1 || true
          grep -v -i "warn\|delisted\|failed download\|^\[" /tmp/ipo_log.txt | tail -30
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git checkout -- data/scan/sectors.json data/scan/sector_hist.csv.gz 2>/dev/null || true   # the ATH scan commits these
          git add data/scan/ipo.json data/scan/ipo_charts 2>/dev/null; git diff --cached --quiet && exit 0
          git commit -qm "IPO cup scan $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
