name: book-paper
on:
  schedule:
    - cron: "45 17 * * 1-5"   # 23:15 IST, after the trend, ATH and Top Bottom runs
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: book-paper, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install -q yfinance pandas requests
          python tools/book_paper.py 2>&1 | grep -v -i "warn\|delisted\|failed download\|^\[" | tail -5
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add paper/book; git diff --cached --quiet && exit 0
          git commit -qm "Paper book $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
