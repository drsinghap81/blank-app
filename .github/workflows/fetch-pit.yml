name: fetch-pit
on:
  push:
    paths: [".github/workflows/fetch-pit.yml", "tools/fetch_pit.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        part: ["2008-01-01:2009-12-31", "2010-01-01:2011-12-31", "2012-01-01:2013-12-31", "2014-01-01:2015-12-31",
               "2016-01-01:2017-12-31", "2018-01-01:2019-12-31", "2020-01-01:2021-12-31", "2022-01-01:2023-12-31",
               "2024-01-01:2024-06-30", "2024-07-01:2026-12-31"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pandas requests
      - run: |
          P="${{ matrix.part }}"; S=${P%%:*}; E=${P##*:}
          mkdir -p pit && python tools/fetch_pit.py $S $E pit/pit_${S}.csv 2>&1 | tee pit/log_${S}.txt
          gzip -f pit/pit_${S}.csv
          echo "TAG=${S}" >> $GITHUB_ENV
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git checkout -B pit-$TAG; git add -f pit; git commit -m "pit $TAG" || exit 0; git push -f origin pit-$TAG
