name: fetch-name-returns
on:
  push:
    paths: [".github/workflows/fetch-name-returns.yml", "tools/fetch_name_returns.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q yfinance pandas requests && python tools/fetch_name_returns.py 2>&1 | tail -60
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git checkout -B name-returns; git add -f data/ret; git commit -m "name returns" || exit 0; git push -f origin name-returns
