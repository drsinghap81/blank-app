name: fetch-fo-all
on:
  push:
    paths: [".github/workflows/fetch-fo-all.yml", "tools/fetch_fo_range.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        part: ["2007-01-01:2009-12-31", "2010-01-01:2012-12-31", "2013-01-01:2015-12-31", "2016-01-01:2018-12-31",
               "2019-01-01:2021-12-31", "2022-01-01:2024-06-30", "2024-07-01:2026-12-31"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pandas requests
      - run: |
          P="${{ matrix.part }}"; S=${P%%:*}; E=${P##*:}
          mkdir -p fo && python tools/fetch_fo_range.py $S $E fo/fo_${S}.csv | tee fo/log_${S}.txt
          echo "TAG=${S}" >> $GITHUB_ENV
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git checkout -B fo-$TAG; git add -f fo; git commit -m "fo $TAG" || exit 0; git push -f origin fo-$TAG
