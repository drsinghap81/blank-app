name: research-oi-delivery
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pandas numpy yfinance
      - run: python tools/research/oi_signals_delivery.py 2>&1 | grep -v -i "warn\|inplace\|whatsnew" | tail -80
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add data/research/oi_signals_delivery.json; git diff --cached --quiet && exit 0
          git commit -m "research: OI signals -> delivery"; for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
