name: research-nsefin
# Probe of NSE financial-results endpoints (14 Nov 2026)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/research/nse_fin_probe.py", ".github/workflows/research-nsefin.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests && python tools/research/nse_fin_probe.py
      - run: |
          git config user.name "trend-desk-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/research/nse_fin_probe
          git commit -m "research: NSE financial results probe" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
