# One-off research (18 Nov 2026): Gurjar bullish momentum scanner
name: research-gurjar
on:
  workflow_dispatch:
    inputs:
      script: { description: "script name", required: false, default: gurjar_momentum }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy pandas yfinance lxml requests && python tools/research/${{ inputs.script || 'gurjar_momentum' }}.py
      - run: |
          git config user.name "trend-desk-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/research/gurjar_*.json; [ -f data/research/nse_pulse_daily.json ] && git add data/research/nse_pulse_daily.json
          git commit -m "research: gurjar momentum scanner" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
