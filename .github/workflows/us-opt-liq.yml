name: us-opt-liq
# Option liquidity (ATM spread, chain OI) for US names on the short watch -> data/scan/us/opt_liq.json
on:
  schedule:
    - cron: "50 0 * * 2-6"    # after the US ATH scan
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: us-opt-liq, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q yfinance pandas && python tools/us_opt_liq.py 2>&1 | tail -5
      - run: |
          git config user.name "us-opt-liq bot"; git config user.email "actions@users.noreply.github.com"
          git add data/scan/us/opt_liq.json; git diff --cached --quiet && exit 0
          git commit -qm "US option liquidity $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep $((i*7)); done
