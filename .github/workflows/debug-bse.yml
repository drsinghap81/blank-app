name: debug-bse
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install -q yfinance pandas requests
          cd tools && python - <<'PY'
          import trend_scan as T, pandas as pd, io
          from datetime import date, timedelta
          for back in range(0, 6):
              d = date.today() - timedelta(days=back)
              if d.weekday() >= 5: continue
              r = T.s.get(f"https://www.bseindia.com/download/BhavCopy/Equity/BhavCopy_BSE_CM_0_0_0_{d:%Y%m%d}_F_0000.CSV", timeout=40, headers={"Referer": "https://www.bseindia.com/"})
              print(d, r.status_code, r.content[:120])
              if r.status_code == 200 and r.content[:5] != b"<!DOC":
                  x = pd.read_csv(io.BytesIO(r.content)); print(list(x.columns)); print(x.head(3).T); break
          u = T.nse_symbols(bse=True); print(u.board.value_counts())
          PY
