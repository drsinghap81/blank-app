name: opt-charts
on:
  schedule:
    - cron: "15 14 * * 1-5"   # 19:45 IST, after NSE publishes the F&O bhavcopy
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: opt-charts, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        with:
          path: optcache
          key: optcache-${{ github.run_id }}
          restore-keys: optcache-
      - name: Build ATM option charts
        run: |
          pip install -q pandas requests numpy
          python tools/opt_charts.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add data/scan/optscan.json data/scan/optcharts.json data/scan/pcr.json data/scan/pcr_hist.json; git diff --cached --quiet && exit 0
          git commit -m "ATM option charts $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
