# One-off research (17 Nov 2026): book strategies: divergence bottom, trend-line correction break, shakeout, bottom patterns with fixed stops
name: research-bansal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/research/bansal_test.py", ".github/workflows/research-bansal.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy pandas yfinance && python tools/research/bansal_test.py 2>&1 | grep -v -i "warn\|failed download\|possibly delisted"
      - run: |
          git config user.name "trend-desk-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/research/bansal_test.json data/research/bansal_trades.csv.gz
          git commit -m "research: book strategies" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
