name: paper-trade
on:
  schedule:
    - cron: "40 13 * * 1-5"   # 19:10 IST, after NSE publishes the F&O bhavcopy
    - cron: "10 16 * * 1-5"   # 21:40 IST retry (idempotent)
  workflow_dispatch:
  push:
    paths: [".github/workflows/paper-trade.yml", "tools/paper_bot.py", "tools/update_futures.py", "tools/fetch_oi.py", "paper/config.json"]
permissions:
  contents: write
concurrency:
  group: paper-trade
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pandas numpy requests
      - name: Paper-trade update
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          SEND_TELEGRAM: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: python tools/paper_bot.py
      - name: Refresh stock/index futures history
        run: python tools/update_futures.py || true
      - name: Option-OI support/resistance levels
        run: python tools/fetch_oi.py || true
      - name: Commit paper results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add paper data/futures data/oi
          git diff --cached --quiet && exit 0
          git commit -m "Paper trade update $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
