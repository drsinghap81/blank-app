name: trend-bt-variants
on:
  push:
    paths: [".github/workflows/trend-bt-variants.yml", "tools/trend_bt_variants.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        market: [US, ASX]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q yfinance pandas numpy requests lxml
      - run: mkdir -p data/btv && (python tools/trend_bt_variants.py ${{ matrix.market }} > data/btv/${{ matrix.market }}_log.txt 2>&1 || true); grep -v -i "warn\|delisted\|failed download\|^\[" data/btv/${{ matrix.market }}_log.txt | tail -20
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan btv-${{ matrix.market }}; git rm -rqf --cached .; git add -f data/btv; git commit -qm "btv ${{ matrix.market }}"; git push -f origin btv-${{ matrix.market }}
