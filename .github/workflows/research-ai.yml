# One-off research (12 Nov 2026): AI / tech ETFs vs the momentum entry rule
name: research-ai
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/research/ai_etf_check.py", ".github/workflows/research-ai.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy pandas yfinance && python tools/research/ai_etf_check.py
      - run: |
          git config user.name "trend-desk-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/research/ai_etf_check.json
          git commit -m "research: AI ETF check" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
