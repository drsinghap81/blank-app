name: fetch-yahoo-all
on:
  push:
    paths: [".github/workflows/fetch-yahoo-all.yml", "tools/fetch_yahoo_all.py"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q yfinance pandas && python tools/fetch_yahoo_all.py | tee yahoo_log.txt && mv yahoo_log.txt yahoo/
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git checkout -B yahoo-all; git add -f yahoo; git commit -m yahoo || exit 0; git push -f origin yahoo-all
