# One-off research runs (12 Nov 2026): tools/research/pie_commod.py -> data/research/pie_commod.json
name: research-pies
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/research/pie_commod.py", ".github/workflows/research-pies.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy pandas yfinance && python tools/research/pie_commod.py
      - run: |
          git config user.name "trend-desk-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/research/pie_commod.json
          git commit -m "research: commodity pie test" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
