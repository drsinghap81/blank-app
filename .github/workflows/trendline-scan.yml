name: trendline-scan
# Trend lines through the 2 latest swing lows (Nifty 500, Indian sector indices, world indices, gold, oil, bitcoin) -> data/scan/trendline.json (app card + server alerts)
on:
  schedule:
    - cron: "15 11 * * 1-5"   # after the India close
    - cron: "40 21 * * 1-5"   # after the US close
  workflow_dispatch:
  push:
    paths: ["tools/trendline_scan.py", ".github/workflows/trendline-scan.yml"]
permissions:
  contents: write
concurrency: {group: trendline-scan, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q yfinance pandas numpy && python tools/trendline_scan.py 2>&1 | grep -v -i warn | tail -12
      - run: |
          git config user.name "trendline-scan bot"; git config user.email "actions@users.noreply.github.com"
          git add data/scan/trendline.json; git diff --cached --quiet && exit 0
          git commit -qm "Trend lines $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep $((i*7)); done
