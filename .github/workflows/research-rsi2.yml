# One-off research (14 Nov 2026): Connors RSI(2) US
name: research-rsi2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/research/rsi2_us.py", ".github/workflows/research-rsi2.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy pandas yfinance lxml && python tools/research/rsi2_us.py
      - run: |
          git config user.name "trend-desk-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/research/rsi2_us.json
          git commit -m "research: RSI2 US" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
