name: fetch-nse-results-2
# Second batch for the fundamental scan test: all other NSE stocks that were ever liquid (> Rs 5 cr/day) since 2016
# (data/fundq/symbols2.txt), 8 shards -> data/fundq/shard_b<n>.json. Resumable; re-run until done.
on:
  workflow_dispatch:
    inputs:
      minutes: {description: "time budget per shard (minutes)", default: "320"}
permissions:
  contents: write
concurrency: {group: fetch-nse-results-2, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests && python tools/fetch_nse_results.py ${{ matrix.shard }} 8 ${{ github.event.inputs.minutes || '320' }}
        env: {FUNDQ_TAG: b, FUNDQ_SYMS: data/fundq/symbols2.txt, FUNDQ_RETRY: "1"}
      - if: always()
        run: |
          git config user.name "fundq bot"; git config user.email "actions@users.noreply.github.com"
          git add data/fundq/shard_b${{ matrix.shard }}.json; git diff --cached --quiet && exit 0
          git commit -qm "NSE results batch 2 shard ${{ matrix.shard }}"
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep $((i*9)); done
