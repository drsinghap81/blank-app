name: world-mclose
# Month-close ATH check for stocks outside the main scans (tools/world_mclose.py -> data/scan/world/<M>.json)
on:
  schedule:
    - cron: "40 23 1-4 * *"   # first days of the month: the new month-end list
    - cron: "40 3 * * 6"      # Saturdays: refresh prices
  workflow_dispatch:
  push:
    paths: ["tools/world_mclose.py", ".github/workflows/world-mclose.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        market: [BSE, SME, JP, HK, CA, EU, KR, TW]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install -q numpy pandas yfinance requests lxml html5lib xlrd openpyxl
          python tools/world_mclose.py ${{ matrix.market }} 2>&1 | grep -v -i "possibly delisted\|failed download\|warn" | tail -25
      - run: |
          git config user.name "world bot"; git config user.email "actions@users.noreply.github.com"
          git add data/scan/world/${{ matrix.market }}.json || exit 0
          git diff --cached --quiet && exit 0
          git commit -qm "World month-close ${{ matrix.market }} $(date -u +%F)"
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase origin main && git push -q && break; sleep $((i*9)); done
