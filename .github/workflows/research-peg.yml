# One-off research (14 Nov 2026): Nifty 500 PEG + 50-DMA screen check
name: research-peg
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/research/peg_scan.py", ".github/workflows/research-peg.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy pandas yfinance lxml && python tools/research/peg_scan.py
      - run: |
          git config user.name "trend-desk-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/research/peg_scan.json data/research/peg_scan.csv
          git commit -m "research: PEG scan" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
