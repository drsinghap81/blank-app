# One-off research (16 Nov 2026): "pause after a big move" iron condor on 9 indices (model priced, calibrated on Nifty)
name: research-condor-world
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/research/condor_world.py", ".github/workflows/research-condor-world.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy pandas yfinance && python tools/research/condor_world.py 2>&1 | grep -v -i warn
      - run: |
          git config user.name "trend-desk-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/research/condor_world.json
          git commit -m "research: condor world" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
