# One-off research (22 Nov 2026): FII cash flows (daily) and sector flows (fortnightly) - probe + tests
name: research-fii
on:
  workflow_dispatch:
    inputs:
      script: { description: "script name", required: false, default: probe_fii }
      pilot: { description: "1 = pilot", required: false, default: "1" }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy pandas yfinance lxml requests html5lib beautifulsoup4 xlrd
      - run: FII=1 PILOT=${{ inputs.pilot == '1' && '1' || '' }} LIMIT=${{ inputs.pilot == '1' && '200' || '0' }} python tools/research/${{ inputs.script || 'probe_fii' }}.py 2>&1 | grep --line-buffered "R|\|Error\|Traceback\|File " ; exit ${PIPESTATUS[0]}
      - run: |
          git config user.name "trend-desk-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/research/fii_*.json data/research/fii_*.csv data/research/confluence_*.json data/research/metals_*.json 2>/dev/null || true
          git commit -m "research: fii" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
