# One-off research (22 Nov 2026): flag / pennant / rectangle stop placement and exits, NSE 2016-26
name: research-flags
on:
  workflow_dispatch:
    inputs:
      pilot: { description: "1 = 150-stock pilot", required: false, default: "1" }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy pandas yfinance lxml requests
      - run: PILOT=${{ inputs.pilot == '1' && '1' || '' }} python tools/research/flag_stops.py 2>&1 | grep --line-buffered "R|\|Error\|Traceback\|File " ; exit ${PIPESTATUS[0]}
      - run: |
          git config user.name "trend-desk-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/research/flag_stops*.json
          git commit -m "research: flag stops" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
