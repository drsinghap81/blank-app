name: group-pulse
on:
  push:
    paths: [".github/workflows/group-pulse.yml", "tools/group_pulse.py"]
  schedule:
    - cron: "40 21 * * 1-5"   # after the US close; NSE and ASX use their latest close
  workflow_dispatch:
concurrency: { group: group-pulse, cancel-in-progress: true }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          SEND_TELEGRAM: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          pip install -q yfinance pandas requests
          python tools/group_pulse.py ASX NSE US UK 2>&1 | grep -v -i "warn\|delisted\|failed download\|possibly\|YFRateLimit" | tail -40
          python tools/results_now.py 2>&1 | tail -2 || true
          python tools/sector_weights.py 2>&1 | grep -v -i "warn\|delisted\|possibly" | tail -8 || true
          python tools/today_calls.py 2>&1 | tail -3 || true
      - run: |
          git config user.name "group-pulse bot"; git config user.email "actions@users.noreply.github.com"
          for f in data/scan/today_calls.json data/scan/today_calls.json.state data/scan/results_season.json data/scan/sector_weights.json data/scan/group_pulse.json data/scan/us/group_pulse.json data/scan/asx/group_pulse.json data/scan/group_pulse_charts.json data/scan/us/group_pulse_charts.json data/scan/asx/group_pulse_charts.json data/scan/stock_weekly.json data/scan/us/stock_weekly.json data/scan/asx/stock_weekly.json data/scan/uk/group_pulse.json data/scan/uk/group_pulse_charts.json data/scan/uk/stock_weekly.json data/scan/group_w_charts data/scan/us/group_w_charts data/scan/asx/group_w_charts data/scan/uk/group_w_charts; do [ -e "$f" ] && git add -A "$f"; done; true
          git diff --cached --quiet && exit 0
          git commit -qm "Industry pulse $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep $((i*7)); done
