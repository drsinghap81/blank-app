name: group-pulse
on:
  push:
    paths: [".github/workflows/group-pulse.yml", "tools/group_pulse.py"]
  schedule:
    - cron: "40 21 * * 1-5"   # after the US close; NSE and ASX use their latest close
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install -q yfinance pandas
          python tools/group_pulse.py NSE US ASX 2>&1 | grep -v -i "warn\|delisted\|failed download\|possibly\|downloaded" | tail -20
      - run: |
          git config user.name "group-pulse bot"; git config user.email "actions@users.noreply.github.com"
          for f in data/scan/group_pulse.json data/scan/us/group_pulse.json data/scan/asx/group_pulse.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet && exit 0
          git commit -qm "Industry pulse $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep $((i*7)); done
