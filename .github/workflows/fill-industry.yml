# 12 Nov 2026: fill missing NSE industries (tools/fill_industry.py), then rerun Pulse
name: fill-industry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/fill_industry.py", ".github/workflows/fill-industry.yml"]
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas requests yfinance && python tools/fill_industry.py
      - run: |
          git config user.name "trend-desk-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/universe/nse_industry.csv
          git commit -m "Fill missing NSE industries" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
      - run: gh workflow run group-pulse.yml
        env: { GH_TOKEN: "${{ github.token }}" }
