name: rsi2-prep
# US RSI(2) trend pullback: nightly levels for the moomoo bot (tools/moomoo_rsi2) and the app (tools/rsi2_prep.py).
on:
  schedule:
    - cron: "40 23 * * 1-5"   # after the US close
  workflow_dispatch:
  push:
    paths: ["tools/rsi2_prep.py", ".github/workflows/rsi2-prep.yml"]
permissions:
  contents: write
concurrency: {group: rsi2-prep, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q numpy pandas yfinance lxml && python tools/rsi2_prep.py
      - run: |
          git config user.name "rsi2 bot"; git config user.email "actions@users.noreply.github.com"
          git add data/scan/us/rsi2.json; git diff --cached --quiet && exit 0
          git commit -qm "RSI2 prep $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep $((i*7)); done
