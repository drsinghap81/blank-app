# One-off research (12 Nov 2026): smallcase-style US stock baskets for Trading 212 pies
name: research-smallcase
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/research/smallcase_us.py", ".github/workflows/research-smallcase.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy pandas yfinance lxml html5lib requests && python tools/research/smallcase_us.py
      - run: |
          git config user.name "trend-desk-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/research/smallcase_us.json
          git commit -m "research: smallcase US baskets" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
