# One-off research (16 Nov 2026): anchored VWAP support/resistance on Nifty 500
name: research-avwap
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/research/avwap_test.py", ".github/workflows/research-avwap.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy pandas yfinance && python tools/research/avwap_test.py 2>&1 | grep -v -i "warn\|failed download\|possibly delisted"
      - run: |
          git config user.name "trend-desk-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/research/avwap_test.json
          git commit -m "research: AVWAP test" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
