name: fetch-hourly
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q yfinance pandas && python tools/fetch_hourly.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan hourly-data; git rm -rq --cached .; git add -f hourly; git commit -qm hourly; git push -f origin hourly-data
