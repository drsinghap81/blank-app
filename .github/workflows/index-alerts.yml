# 20 Nov 2026: index W + trendline + volume + EMA 9 lift-off (tools/index_w_alert.py). Also runs nightly inside ath-scan.yml.
name: index-alerts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pandas numpy requests
      - run: python tools/index_w_alert.py && python tools/sector_rrg.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add data/scan/index_ohlcv.csv.gz data/scan/index_w.json data/scan/sector_rrg.json data/scan/sector_rrg_hist.json data/scan/index_w_charts; git diff --cached --quiet && exit 0
          git commit -qm "Index alerts $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
