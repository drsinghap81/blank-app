name: trend-scan-asx
on:
  push:
    paths: [".github/workflows/trend-scan-asx.yml", "tools/trend_scan.py", "tools/global_universe.py"]
  schedule:
    - cron: "30 7 * * 1-5"    # ~6:30 pm Sydney, after the ASX close
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trend-scan-asx
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Scan
        env:
          SEND_TELEGRAM: "0"
        run: |
          pip install -q yfinance pandas requests lxml
          mkdir -p data/scan/asx
          python tools/trend_scan.py ASX > /tmp/scan_log.txt 2>&1 || true
          grep -v -i "warn\|inplace\|whatsnew\|delisted\|df.drop\|df.rename\|failed download" /tmp/scan_log.txt | tail -40
      - name: Commit results to main
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          rm -f data/scan/asx/all_metrics.csv
          git add data/scan/asx; git diff --cached --quiet && exit 0
          git commit -m "Trend scan ASX $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 10; done
